<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Command Center & Stream Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --void:#0a0a0c;
    --panel:#111114;
    --panel-raised:#17171b;
    --red:#e21f2d;
    --red-fill: rgba(226,31,45,.18);
    --ash:#f3f1ee;
    --mist:#9a969e;
    --hairline: rgba(226,31,45,.45);
    --glow: rgba(226,31,45,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#1a1a1d;
    color:var(--ash);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .app{ max-width:1680px; margin:0 auto; }
  .app__header{ margin-bottom:16px; }
  .app__header h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px;
    margin:0; letter-spacing:.02em;
  }

  /* ---------- Toolbar & Controls ---------- */
  .toolbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-bottom:18px; background:var(--panel); padding:12px 16px;
    border:1px solid var(--hairline); border-radius:6px;
  }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab{
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:.04em;
    text-transform:uppercase; background:#222226; color:var(--mist);
    border:1px solid #2c2c31; border-radius:6px; padding:8px 14px; cursor:pointer;
  }
  .tab[data-active="true"]{ background:var(--red-fill); color:var(--ash); border-color:var(--red); }
  .spacer{ flex:1; }

  .control-group{ display:flex; align-items:center; gap:8px; }
  .control-label{
    font-family:'Rajdhani',sans-serif; font-size:11px; color:var(--mist);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .swatches{ display:flex; gap:6px; }
  .swatch{ width:20px; height:20px; border-radius:50%; border:2px solid #2c2c31; cursor:pointer; padding:0; }
  .swatch[data-active="true"]{ border-color:#fff; }
  #customColor{ width:30px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  
  select, input[type="text"]{
    background:var(--void); border:1px solid var(--hairline); color:var(--ash);
    border-radius:4px; padding:5px 8px; font-family:'Inter', sans-serif; font-size:12px; cursor:pointer;
  }
  select:focus, input[type="text"]:focus{ outline:2px solid var(--red); }

  .action-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.04em;
    text-transform:uppercase; background:var(--red); color:#1a0507;
    border:1px solid var(--red); border-radius:6px; padding:8px 16px; cursor:pointer;
    transition: filter .15s ease;
  }
  .action-btn:hover{ filter:brightness(1.08); }
  .action-btn.ghost{ background:transparent; color:var(--mist); border-color:#2c2c31; }
  .action-btn.small { padding:4px 8px; font-size:11px; }

  /* ---------- Workspace views ---------- */
  .view-panel{ display:none; }
  .view-panel[data-active="true"]{ display:block; }

  /* ---------- Planning Mat Styling (16:9 Scaled) ---------- */
  .mat-scale-wrapper{ position:relative; width:100%; overflow:hidden; min-height: 450px; }
  .mat{
    width:1600px; height:900px;
    background:var(--void); border:2px solid var(--red); border-radius:6px;
    position:absolute; top:0; left:0; transform-origin: top left;
    padding:28px 34px 24px; display:flex; flex-direction:column;
    font-family:'Rajdhani',sans-serif; color:var(--ash);
  }
  
  .mat.is-exporting .block__remove,
  .mat.is-exporting .block__imgremove,
  .mat.is-exporting .block__addimg,
  .mat.is-exporting .daycol__addbtn {
    display: none !important;
  }
  .mat.is-exporting [contenteditable="true"] {
    background: transparent !important;
  }

  .corner{ position:absolute; width:26px; height:26px; pointer-events:none; }
  .corner::before, .corner::after{ content:""; position:absolute; background:var(--red); }
  .corner::before{ height:3px; width:100%; }
  .corner::after{ width:3px; height:100%; }
  .corner--tl{ top:12px; left:12px; } .corner--tl::before{ top:0; left:0; } .corner--tl::after{ top:0; left:0; }
  .corner--tr{ top:12px; right:12px; } .corner--tr::before{ top:0; right:0; } .corner--tr::after{ top:0; right:0; }
  .corner--bl{ bottom:12px; left:12px; } .corner--bl::before{ bottom:0; left:0; } .corner--bl::after{ bottom:0; left:0; }
  .corner--br{ bottom:12px; right:12px; } .corner--br::before{ bottom:0; right:0; } .corner--br::after{ bottom:0; right:0; }

  .top-tab{
    position:absolute; top:-2px; left:50%; transform:translateX(-50%) rotate(45deg);
    width:16px; height:16px; background:var(--red);
  }
  .top-tab__line{ position:absolute; top:6px; height:2px; background:var(--hairline); width:140px; }
  .top-tab__line--l{ right:calc(50% + 12px); }
  .top-tab__line--r{ left:calc(50% + 12px); }

  .mat__header{ position:relative; display:flex; flex-direction:column; align-items:center; padding-top:6px; }
  .badge{
    position:absolute; top:-6px; left:2px; width:64px; height:64px; border-radius:50%;
    border:3px solid var(--red); background:var(--panel); display:flex; align-items:center; justify-content:center;
  }
  .mat-title{
    font-family:'Big Shoulders Stencil',sans-serif; font-weight:800; font-size:52px;
    letter-spacing:.03em; color:var(--ash); text-align:center; margin:0; text-shadow: 0 0 18px var(--glow); outline:none;
  }
  .mat-meta{
    position:absolute; top:2px; right:2px; font-family:'Space Mono',monospace; font-size:12px; color:var(--mist); text-align:right; outline:none;
  }

  .matgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; flex:1; min-height:0; margin-top:30px; }
  .daycol{
    border:1.5px solid var(--hairline); border-radius:4px; background:var(--panel);
    display:flex; flex-direction:column; padding:10px 9px; min-height:0;
  }
  .daycol__day{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; letter-spacing:.04em;
    color:var(--red); text-transform:uppercase; text-align:center; outline:none;
  }
  .daycol__subtitle{
    font-size:10.5px; color:var(--mist); text-align:center; margin:4px 0 10px; letter-spacing:.02em; outline:none;
  }
  .daycol__blocks{ display:flex; flex-direction:column; gap:7px; flex:1; min-height:0; overflow-y:auto; }
  
  .block{
    border:1px solid var(--hairline); border-radius:3px; background:var(--panel-raised);
    display:flex; flex-direction:column; overflow:hidden; position:relative; flex-shrink:0;
  }
  .block__remove{
    position:absolute; top:2px; right:2px; width:15px; height:15px;
    background:rgba(0,0,0,.45); color:var(--mist); border:none; border-radius:50%;
    font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .block__remove:hover{ color:var(--red); background:rgba(0,0,0,.7); }

  .block__label{
    background:var(--red-fill); color:var(--red); font-family:'Space Mono',monospace; font-size:9.5px;
    text-transform:uppercase; padding:4px 18px 4px 6px; text-align:center; outline:none; flex:0 0 auto;
  }
  
  .block__imgwrap{
    position:relative; width:100%; display:none; background:rgba(0,0,0,.3);
    border-bottom:1px solid var(--hairline); overflow:hidden;
  }
  .block__imgwrap[data-has="true"]{ display:block; }
  .block__img{ width:100%; height:110px; object-fit:cover; display:block; }
  .block__imgremove{
    position:absolute; top:4px; right:4px; width:16px; height:16px;
    background:rgba(0,0,0,0.7); color:var(--mist); border:none; border-radius:50%;
    font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:4;
  }
  .block__imgremove:hover{ color:var(--red); }

  .block__body{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px 7px; outline:none; min-height:36px;
  }
  [contenteditable="true"]:hover{ background:rgba(226,31,45,.06); }
  [contenteditable="true"]:focus{ background:rgba(226,31,45,.12); }

  .block__addimg{
    width:100%; background:transparent; border:none; border-top:1px dashed var(--hairline);
    color:var(--mist); font-family:'Rajdhani',sans-serif; font-size:9.5px; text-transform:uppercase; padding:3px 0; cursor:pointer;
  }
  .block__addimg:hover{ color:var(--red); }
  .daycol__addbtn{
    margin-top:6px; width:100%; background:transparent; border:1px dashed var(--hairline);
    color:var(--mist); font-family:'Rajdhani',sans-serif; font-size:10.5px; text-transform:uppercase; border-radius:3px; padding:5px 0; cursor:pointer;
  }
  .daycol__addbtn:hover{ color:var(--red); border-color:var(--red); }

  /* ---------- Stream Control Desk Layout ---------- */
  .desk-container { display:flex; flex-direction:column; gap:16px; margin-top:10px; }
  .desk-grid { 
    column-count: 2;
    column-gap: 16px;
  }
  @media (max-width: 900px) { .desk-grid { column-count: 1; } }

  .desk-card, .sticky-card {
    background: var(--panel); 
    border: 1px solid var(--hairline); 
    border-radius: 6px; 
    padding: 20px 22px;
    width: 100%;
    position: relative;
    break-inside: avoid;
    margin-bottom: 16px;
    display: inline-block;
  }
  .desk-card.span-full, .sticky-card.span-full {
    column-span: all;
  }

  .sticky-card { background: var(--panel-raised); }
  .sticky-card::before{
    content:""; position:absolute; top:-7px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%; background:var(--red);
  }

  .desk-card__header, .sticky-card__header-bar {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    border-bottom: 1px dashed var(--hairline); padding-bottom: 8px; flex-wrap: wrap; gap: 8px;
  }
  .card-reorder-controls { display: flex; gap: 4px; align-items: center; }
  .reorder-btn {
    background: var(--void); border: 1px solid var(--hairline); color: var(--mist);
    width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .reorder-btn:hover { color: var(--red); border-color: var(--red); }

  .timer-block{ display:flex; flex-direction:column; gap:14px; height:100%; }
  .clockwrap{
    align-self:flex-start; border:2px solid var(--hairline); border-radius:12px;
    padding:14px 20px; background:var(--panel-raised); text-align:center; transition:border-color .25s ease;
  }
  .clockwrap[data-state="running"], .clockwrap[data-state="live"], .clockwrap[data-state="onair"]{ border-color:var(--red); }
  .clock-display{ font-family:'Space Mono',monospace; font-weight:700; font-size:38px; color:var(--ash); }
  .clock-display--live{ color:var(--red); }
  .clock-label-under{ margin-top:4px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mist); font-family:'Rajdhani',sans-serif; font-weight:600; }

  .field-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  label.small-label{ font-family:'Rajdhani',sans-serif; font-weight:600; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--mist); display:block; margin-bottom:4px; }
  input[type="number"], input[type="text"], textarea{
    background:var(--void); border:1px solid var(--hairline); color:var(--ash);
    border-radius:6px; padding:9px 11px; font-family:'Inter', sans-serif; font-size:13px;
  }
  input[type="number"]:focus, input[type="text"]:focus, textarea:focus{ outline:2px solid var(--red); border-color:transparent; }
  
  .sticky-card__title { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; text-transform:uppercase; background:transparent; border:none; color:var(--red); width:100%; outline:none; max-width: 260px; }
  .sticky-card__body{ background:transparent; border:1px solid var(--hairline); border-radius:6px; resize:vertical; flex:1; font-size:13px; color:var(--ash); line-height:1.5; min-height: 120px; padding:10px; width:100%; }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  button.chip{ padding:6px 12px; font-size:11px; background:var(--void); border:1px solid var(--hairline); color:var(--ash); border-radius:4px; cursor:pointer; font-family:'Rajdhani',sans-serif; text-transform:uppercase; }
  button.chip:hover{ border-color:var(--mist); }

  .log-list{ list-style:none; margin:0; padding:0; max-height:240px; overflow-y:auto; border-top:1px solid var(--hairline); }
  .log-list li{ display:flex; gap:12px; align-items:baseline; padding:8px 2px; border-bottom:1px solid var(--hairline); }
  .log-list__time{ font-family:'Space Mono',monospace; font-size:12px; color:var(--red); min-width:85px; }
  .log-list__note{ flex:1; font-size:13px; }
  .log-list__del{ background:transparent; border:none; color:var(--mist); cursor:pointer; }
  .log-list__del:hover{ color:var(--red); }
  
  footer{ text-align:center; font-size:12px; color:var(--mist); margin-top:20px; }
</style>
</head>
<body>
<div class="app">
  <div class="app__header">
    <h1>Creator Command Center & Stream Desk</h1>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab" data-view="blueprint" data-active="true">Weekly Blueprint</button>
      <button class="tab" data-view="release">Content Schedule</button>
      <button class="tab" data-view="controldesk">Stream Control Desk</button>
    </div>

    <div class="control-group">
      <span class="control-label">Global Font</span>
      <select id="globalFontSelect">
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Rajdhani', sans-serif">Rajdhani</option>
        <option value="'Space Mono', monospace">Space Mono</option>
        <option value="'Plus Jakarta Sans', sans-serif">Jakarta Sans</option>
        <option value="'JetBrains Mono', monospace">JetBrains</option>
        <option value="'Orbitron', sans-serif">Orbitron</option>
        <option value="'Cinzel', serif">Cinzel</option>
        <option value="'Teko', sans-serif">Teko</option>
      </select>
      <select id="globalSizeSelect">
        <option value="9px">9px</option>
        <option value="10px">10px</option>
        <option value="11px" selected>11.5px</option>
        <option value="13px">13px</option>
        <option value="15px">15px</option>
        <option value="18px">18px</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Palette</span>
      <div class="swatches" id="swatches"></div>
      <input type="color" id="customColor" value="#e21f2d" aria-label="Custom accent color">
    </div>

    <div class="spacer"></div>
    <button class="action-btn ghost" id="resetBtn">Reset Defaults</button>
    <button class="action-btn" id="exportBtn">Export Active Mat (PNG)</button>
  </div>

  <div class="view-panel" data-view="blueprint" data-active="true">
    <div class="mat-scale-wrapper" id="scaleWrapperBP">
      <div class="mat" id="mat-blueprint" data-matname="creator-weekly-blueprint"></div>
    </div>
  </div>

  <div class="view-panel" data-view="release">
    <div class="mat-scale-wrapper" id="scaleWrapperRel">
      <div class="mat" id="mat-release" data-matname="video-release-schedule"></div>
    </div>
  </div>

  <div class="view-panel" data-view="controldesk">
    <div class="desk-container">
      
      <div class="desk-grid" id="unifiedDeskGrid">
        
        <div class="desk-card" data-card-id="game-switch">
          <div class="desk-card__header">
            <div>
              <p style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; margin:0; text-transform:uppercase;">Countdown</p>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span id="gameStatusDot" style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; text-transform:uppercase; color:var(--mist);">Idle</span>
              <div class="card-reorder-controls">
                <button class="reorder-btn shift-left" title="Move Left">◄</button>
                <button class="reorder-btn shift-right" title="Move Right">►</button>
                <button class="reorder-btn size-toggle" title="Toggle Size (Half/Full)">⤢</button>
              </div>
            </div>
          </div>
          <div class="timer-block">
            <div class="clockwrap" id="gameClockWrap">
              <div class="clock-display" id="gameClockDisplay">120:00</div>
              <div class="clock-label-under" id="gameClockLabelUnder">Switch to next game</div>
            </div>
            <div>
              <label class="small-label" for="timerLabel">Cue Label</label>
              <input type="text" id="timerLabel" value="Switch to next game" maxlength="60" style="width:100%; max-width:320px;">
            </div>
            <div class="field-row">
              <div>
                <label class="small-label" for="minInput">Minutes</label>
                <input type="number" id="minInput" value="120" min="0" max="999" style="width:70px; text-align:center;">
              </div>
              <span style="font-family:'Space Mono',monospace; padding-top:16px;">:</span>
              <div>
                <label class="small-label" for="secInput">Seconds</label>
                <input type="number" id="secInput" value="0" min="0" max="59" style="width:70px; text-align:center;">
              </div>
            </div>
            <div class="chip-row">
              <button class="chip" data-preset="30">30m</button>
              <button class="chip" data-preset="60">60m</button>
              <button class="chip" data-preset="90">90m</button>
              <button class="chip" data-preset="120">120m</button>
            </div>
            <div class="chip-row">
              <button class="action-btn" id="startBtn">Start</button>
              <button class="action-btn ghost" id="pauseBtn">Pause</button>
              <button class="action-btn ghost" id="resetTimerBtn">Reset</button>
              <button class="action-btn" id="dismissAlarmBtn" style="display:none; background:#a239f2; color:#fff;">Dismiss Alarm</button>
            </div>
          </div>
        </div>

        <div class="sticky-card" data-card-id="stream-reminder">
          <div class="sticky-card__header-bar">
            <input class="sticky-card__title" value="Stream Reminder" maxlength="30">
            <div class="card-reorder-controls">
              <button class="reorder-btn shift-left" title="Move Left">◄</button>
              <button class="reorder-btn shift-right" title="Move Right">►</button>
              <button class="reorder-btn size-toggle" title="Toggle Size (Half/Full)">⤢</button>
            </div>
          </div>
          <textarea class="sticky-card__body" id="stickyBody" placeholder="Goals, cues, or reminders for mid-stream..."></textarea>
        </div>

        <div class="desk-card" data-card-id="stream-stopwatch">
          <div class="desk-card__header">
            <div>
              <p style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; margin:0; text-transform:uppercase;">Stream Stopwatch & Live Stats</p>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span id="streamStatusDot" style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; text-transform:uppercase; color:var(--mist);">Off air</span>
              <div class="card-reorder-controls">
                <button class="reorder-btn shift-left" title="Move Left">◄</button>
                <button class="reorder-btn shift-right" title="Move Right">►</button>
                <button class="reorder-btn size-toggle" title="Toggle Size (Half/Full)">⤢</button>
              </div>
            </div>
          </div>

          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
            <div class="clockwrap" id="streamClockWrap">
              <div class="clock-display" id="streamClockDisplay">00:00:00</div>
            </div>
            <div class="chip-row" style="align-items:center;">
              <button class="action-btn" id="streamStartBtn">Go Live / Resume</button>
              <button class="action-btn ghost" id="streamPauseBtn">Pause</button>
              <button class="action-btn ghost" id="streamResetBtn">Reset</button>
            </div>
            <div style="display:flex; align-items:center; gap:6px; background:var(--void); border:1px solid var(--hairline); border-radius:6px; padding:6px 10px;">
              <label class="small-label" for="manualTimeInput" style="margin:0;">Set Time:</label>
              <input type="text" id="manualTimeInput" placeholder="00:15:00" style="width:85px; text-align:center;">
              <button class="action-btn small" id="streamSetTimeBtn">Apply</button>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
            <span id="logClockBadge" title="Click to sync/insert current time into note input" style="font-family:'Space Mono',monospace; background:var(--void); border:1px solid var(--hairline); border-radius:6px; padding:9px 12px; color:var(--red); cursor:pointer;">00:00:00 ⟳</span>
            <input type="text" id="noteInput" placeholder="Add chapter note..." style="flex:1; min-width:220px;">
            <button class="action-btn" id="logBtn">Add Note</button>
            <button class="action-btn ghost" id="markBtn">Mark ⏱</button>
          </div>

          <ul class="log-list" id="logList"></ul>
          <p id="logEmpty" style="color:var(--mist); font-size:13px; text-align:center; padding:12px 0;">No notes or chapter markers logged yet.</p>

          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="action-btn ghost" id="exportLogBtn">Export Log (.txt)</button>
            <button class="action-btn ghost" id="clearLogBtn" style="color:var(--red); border-color:var(--red);">Clear Log</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer>Unified Creator Toolkit • Local persistence active</footer>
</div>

<script>
  const globalFontSelect = document.getElementById('globalFontSelect');
  const globalSizeSelect = document.getElementById('globalSizeSelect');
  const stickyBody = document.getElementById('stickyBody');
  const matBlueprint = document.getElementById('mat-blueprint');
  const matRelease = document.getElementById('mat-release');

  const blueprintData = {
    title: "CREATOR WEEKLY BLUEPRINT", meta: "25-HR NON-STREAMING ALLOCATION",
    columns: [
      { day:"MONDAY", subtitle:"6 HR STREAM + PRE-PREP", blocks:[
        {label:"DAYTIME", body:"Stream setup, titles, & community check-ins."},
        {label:"BLOCK 1", body:"Minecraft Cobblemon / Modded SMP"},
        {label:"BLOCK 2", body:"Game Demo or Review Key"}
      ]},
      { day:"TUESDAY", subtitle:"PROD, EDIT & BACKLOG", blocks:[
        {label:"BLOCK 1", body:"Video Editing & VOD Pipeline Archiving"},
        {label:"BLOCK 2", body:"Asset Creation & Collab Planning"}
      ]},
      { day:"WEDNESDAY", subtitle:"6 HR STREAM + NARRATIVE", blocks:[
        {label:"DAYTIME", body:"Mid-week review & stream board prep."},
        {label:"BLOCK 1", body:"Narrative RPG Campaign"}
      ]},
      { day:"THURSDAY", subtitle:"CREATIVE WRITING & DEV", blocks:[
        {label:"BLOCK 1", body:"TTRPG System Design & Expansion Modules"}
      ]},
      { day:"FRIDAY", subtitle:"GAME GREMLINS LIVE", blocks:[
        {label:"START 7PM", body:"Podcast & Community Multiplayer"}
      ]},
      { day:"SATURDAY", subtitle:"REST & RECOVERY", blocks:[
        {label:"OFF-AIR", body:"Completely offline."}
      ]},
      { day:"SUNDAY", subtitle:"THE FUCTORY TOUR", blocks:[
        {label:"START 7PM", body:"Community multiplayer session."}
      ]}
    ]
  };

  const releaseData = {
    title: "CONTENT SCHEDULE", meta: "VIDEO RELEASE LINEUP",
    columns: [
      { day:"MONDAY", subtitle:"NO RELEASE", blocks:[{label:"STATUS", body:"Editing continues."}]},
      { day:"TUESDAY", subtitle:"VIDEO RELEASE", blocks:[{label:"RELEASES", body:"Monday Stream VOD."}]},
      { day:"WEDNESDAY", subtitle:"VIDEO RELEASE", blocks:[{label:"RELEASES", body:"Sunday Tour VOD."}]},
      { day:"THURSDAY", subtitle:"NO RELEASE", blocks:[{label:"STATUS", body:"Writing day."}]},
      { day:"FRIDAY", subtitle:"VIDEO RELEASE", blocks:[{label:"RELEASES", body:"Wednesday Edit."}]},
      { day:"SATURDAY", subtitle:"VIDEO RELEASE", blocks:[{label:"RELEASES", body:"Bonus Feature."}]},
      { day:"SUNDAY", subtitle:"VIDEO RELEASE", blocks:[{label:"RELEASES", body:"Special Release."}]}
    ]
  };

  function esc(str){
    return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function blockHtml(b){
    const hasImg = !!b.img;
    return `
      <div class="block">
        <button class="block__remove" title="Remove box">✕</button>
        <div class="block__label" contenteditable="true" spellcheck="false">${esc(b.label)}</div>
        <div class="block__imgwrap" data-has="${hasImg}">
          <img class="block__img" alt="" src="${hasImg ? b.img : ''}">
          <button class="block__imgremove" title="Remove image">✕</button>
        </div>
        <div class="block__body" contenteditable="true" spellcheck="false">${esc(b.body)}</div>
        <button class="block__addimg">+ Add Image</button>
      </div>
    `;
  }

  function renderMat(container, data){
    const colsHtml = data.columns.map(col => `
      <div class="daycol">
        <div class="daycol__day" contenteditable="true" spellcheck="false">${esc(col.day)}</div>
        <div class="daycol__subtitle" contenteditable="true" spellcheck="false">${esc(col.subtitle)}</div>
        <div class="daycol__blocks">${col.blocks.map(blockHtml).join('')}</div>
        <button class="daycol__addbtn">+ Add Box</button>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="corner corner--tl"></div><div class="corner corner--tr"></div>
      <div class="corner corner--bl"></div><div class="corner corner--br"></div>
      <div class="top-tab"></div>
      <div class="top-tab__line top-tab__line--l"></div><div class="top-tab__line top-tab__line--r"></div>
      <div class="mat__header">
        <div class="badge">
          <svg width="28" height="28" viewBox="0 0 24 24" stroke="var(--red)" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 20V6M12 6l-5 5M12 6l5 5"/></svg>
        </div>
        <div class="mat-meta" contenteditable="true" spellcheck="false">${esc(data.meta)}</div>
        <h2 class="mat-title" contenteditable="true" spellcheck="false">${esc(data.title)}</h2>
      </div>
      <div class="matgrid">${colsHtml}</div>
    `;
    applyGlobalTypography();
  }

  renderMat(matBlueprint, blueprintData);
  renderMat(matRelease, releaseData);

  function applyGlobalTypography(){
    if (!globalFontSelect || !globalSizeSelect || !stickyBody) return;
    const font = globalFontSelect.value;
    const size = globalSizeSelect.value;
    
    document.querySelectorAll('.block__body').forEach(el => {
      el.style.fontFamily = font;
      el.style.fontSize = size;
    });
    stickyBody.style.fontFamily = font;
    stickyBody.style.fontSize = size;
  }

  globalFontSelect.addEventListener('change', applyGlobalTypography);
  globalSizeSelect.addEventListener('change', applyGlobalTypography);

  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.view-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.dataset.active = 'false');
      tab.dataset.active = 'true';
      const target = tab.dataset.view;
      panels.forEach(p => p.dataset.active = (p.dataset.view === target) ? 'true' : 'false');
      fitScales();
    });
  });

  function fitScales(){
    ['BP', 'Rel'].forEach(s => {
      const wrapper = document.getElementById('scaleWrapper' + s);
      if (!wrapper || wrapper.clientWidth === 0) return;
      const mat = wrapper.querySelector('.mat');
      if (!mat) return;
      const scale = Math.min(1, wrapper.clientWidth / 1600);
      mat.style.transform = `scale(${scale})`;
      wrapper.style.height = (900 * scale) + 'px';
    });
  }
  window.addEventListener('resize', fitScales);
  window.addEventListener('load', fitScales);
  setTimeout(fitScales, 50);

  // Multi-column Desk Card Reordering & Size Toggle
  document.querySelectorAll('#unifiedDeskGrid .shift-left').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const card = e.target.closest('.desk-card, .sticky-card');
      const parent = card.parentElement;
      if (card.previousElementSibling) {
        parent.insertBefore(card, card.previousElementSibling);
      }
    });
  });

  document.querySelectorAll('#unifiedDeskGrid .shift-right').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const card = e.target.closest('.desk-card, .sticky-card');
      const parent = card.parentElement;
      if (card.nextElementSibling) {
        parent.insertBefore(card.nextElementSibling, card);
      }
    });
  });

  document.querySelectorAll('#unifiedDeskGrid .size-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const card = e.target.closest('.desk-card, .sticky-card');
      card.classList.toggle('span-full');
    });
  });
</script>
</body>
</html>
